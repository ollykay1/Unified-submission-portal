<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USP – View Submissions</title>

<style>
*{ box-sizing:border-box; }
html,body{
  width:100%;
  height:100%;
  overflow-x:hidden;
}
body {
  font-family: Arial;
  background:#f4f6f9;
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  user-select:none;
}

/* ===== HEADER ===== */
header {
  background:#003366;
  color:#fff;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:1000;
}

header h1 {
  margin:0;
  font-size:18px;
  white-space:nowrap;
}

/* NAV */
nav {
  display:flex;
  gap:16px;
  align-items:center;
}

nav a {
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}

/* HAMBURGER */
.menu-toggle {
  display:none;
  font-size:26px;
  cursor:pointer;
}

/* ===== MOBILE HEADER ===== */
@media (max-width: 768px) {
  .menu-toggle { display:block; }

  nav {
    display:none;
    flex-direction:column;
    align-items:flex-start;
    background:#fff;
    position:absolute;
    top:100%;
    right:12px;
    width:230px;
    padding:16px;
    border-radius:8px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
  }

  nav.active { display:flex; }

  nav a {
    color:#003366;
    font-size:16px;
    font-weight:700;
    width:100%;
    padding:10px 0;
    border-bottom:1px solid #eee;
  }
}

/* ===== MAIN ===== */
main {
  padding:20px;
  max-width:900px;
  margin:auto;
  flex:1;
}

.section {
  background:#fff;
  padding:20px;
  margin-top:20px;
  border-radius:8px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.section h2 {
  margin-top:0;
}

input[type="text"] {
  padding:8px;
  width:100%;
  max-width:300px;
  margin-top:10px;
}

/* ===== TABLE ===== */
table {
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  table-layout:fixed;
}

th, td {
  padding:10px;
  border:1px solid #ccc;
  text-align:left;
  font-size:14px;
  word-wrap:break-word;
}

th {
  background:#003366;
  color:#fff;
}

button {
  padding:6px 12px;
  border:none;
  border-radius:5px;
  background:#003366;
  color:#fff;
  cursor:pointer;
}

button:hover {
  background:#002244;
}

.no-data {
  text-align:center;
  font-style:italic;
  color:#666;
}

/* ===== FOOTER ===== */
footer {
  background:#003366;
  color:#fff;
  text-align:center;
  padding:15px;
  font-size:13px;
  margin-top:auto;
}

/* MOBILE TABLE TWEAK */
@media (max-width: 768px) {
  th, td {
    font-size:12px;
    padding:6px;
  }
}
</style>
</head>

<body>

<header>
  <h1>USP | View Submissions</h1>

  <div class="menu-toggle" id="menuToggle">☰</div>

  <nav id="navMenu">
    <a href="dashboard-lecturer.html">Dashboard</a>
    <a href="profile-lecturer.html">Profile</a>
    <a href="lecturer signup and login.html" onclick="logout()">Logout</a>
  </nav>
</header>

<main>
  <div class="section">
    <h2>Submissions – <span id="assignmentName"></span></h2>

    <input
      type="text"
      id="filterStudent"
      placeholder="Filter by Matric No or Name"
      onkeyup="filterSubmissions()"
    >

    <table id="submissionsTable">
      <tr>
        <th>Student Name</th>
        <th>Matric Number</th>
        <th>Type</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
      <tr class="no-data">
        <td colspan="5">No submissions yet</td>
      </tr>
    </table>
  </div>
</main>

<footer>
  © 2026 University Submission Portal (USP). All rights reserved.
</footer>

<script>
/* ===== MOBILE MENU (CONSISTENT FIX) ===== */
const toggle = document.getElementById('menuToggle');
const nav = document.getElementById('navMenu');

toggle.onclick = e => {
  e.stopPropagation();
  nav.classList.toggle('active');
};

document.addEventListener('click', e => {
  if(!nav.contains(e.target) && !toggle.contains(e.target)){
    nav.classList.remove('active');
  }
});

/* ===== DATA ===== */
const course = localStorage.getItem('selectedCourse');
const assignments = JSON.parse(localStorage.getItem(course + '_assignments') || '[]');
const assignment = assignments[0] || { title: 'No Assignment' };
document.getElementById('assignmentName').innerText = assignment.title;

let submissions = JSON.parse(
  localStorage.getItem(course + '_' + assignment.title + '_submissions') || '[]'
);

/* RENDER TABLE */
function renderSubmissions(list = submissions){
  const table = document.getElementById('submissionsTable');
  table.innerHTML = `
    <tr>
      <th>Student Name</th>
      <th>Matric Number</th>
      <th>Type</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  `;

  if(list.length === 0){
    table.innerHTML += '<tr><td colspan="5" class="no-data">No submissions yet</td></tr>';
    return;
  }

  list.forEach(s => {
    table.innerHTML += `
      <tr>
        <td>${s.student}</td>
        <td>${s.matric || '-'}</td>
        <td>${s.type}</td>
        <td>${s.status}</td>
        <td>
          <button onclick="grade('${s.matric}')">
            ${s.status === 'Pending' ? 'Grade' : 'View'}
          </button>
        </td>
      </tr>
    `;
  });
}

renderSubmissions();

/* FILTER */
function filterSubmissions(){
  const value = document.getElementById('filterStudent').value.toLowerCase();
  renderSubmissions(
    submissions.filter(s =>
      s.student.toLowerCase().includes(value) ||
      (s.matric && s.matric.toLowerCase().includes(value))
    )
  );
}

function grade(matric){
  localStorage.setItem('selectedStudent', matric);
  window.location.href = 'grade-assignment.html';
}

function logout(){
  window.location.href = 'lecturer-login.html';
}

/* COPY PROTECTION */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if(e.ctrlKey && ['c','x','u','s'].includes(e.key.toLowerCase())) e.preventDefault();
});
</script>

</body>
</html>
