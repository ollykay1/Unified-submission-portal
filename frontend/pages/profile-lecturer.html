<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USP – Lecturer Profile</title>

<style>
/* ===== RESET & GLOBAL ===== */
*,
*::before,
*::after{
  box-sizing:border-box;
}
html,body{
  width:100%;
  height:100%;
  overflow-x:hidden;
}
body{
  font-family:Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  display:flex;
  flex-direction:column;
  user-select:none;
}

/* ===== HEADER ===== */
header{
  background:#003366;
  color:#fff;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:1000;
}
header h1{
  margin:0;
  font-size:18px;
  white-space:nowrap;
}

/* NAV */
nav{
  display:flex;
  gap:16px;
}
nav a{
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}

/* HAMBURGER */
.menu-toggle{
  display:none;
  font-size:26px;
  cursor:pointer;
}

/* MOBILE NAV */
@media(max-width:768px){
  .menu-toggle{display:block}

  nav{
    position:absolute;
    top:100%;
    right:12px;
    width:220px;
    background:#fff;
    flex-direction:column;
    padding:14px 16px;
    gap:14px;
    border-radius:8px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    display:none;
  }
  nav.active{display:flex}
  nav a{
    color:#003366;
    font-size:15px;
    border-bottom:1px solid #eee;
    padding-bottom:8px;
  }
}

/* ===== MAIN ===== */
main{
  flex:1;
  padding:20px 14px;
}
.container{
  max-width:1000px;
  margin:auto;
}

/* ===== SECTIONS ===== */
.section{
  background:#fff;
  padding:22px;
  margin-bottom:22px;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.section h2{
  margin-top:0;
  color:#003366;
  font-size:18px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px;
  border:1px solid #ddd;
  font-size:14px;
}
th{
  background:#003366;
  color:#fff;
  text-align:left;
}

/* ===== MOBILE TABLE ===== */
@media(max-width:600px){
  th,td{
    font-size:15px;
    padding:14px;
  }
  table, tr, td, th{
    display:block;
    width:100%;
  }
  tr{margin-bottom:12px}
  th{
    border-radius:6px 6px 0 0;
  }
  td{
    border-top:none;
    font-weight:bold;
  }
}

/* ===== FOOTER ===== */
footer{
  background:#003366;
  color:#fff;
  text-align:center;
  padding:14px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>USP | Lecturer Profile</h1>
  <div class="menu-toggle" id="menuToggle">☰</div>
  <nav id="navMenu">
    <a href="dashboard-lecturer.html">Dashboard</a>
   
    <a href="lecturer signup and login.html" onclick="logout()">Logout</a>
  </nav>
</header>

<main>
  <div class="container">

    <div class="section">
      <h2>Profile Information</h2>
      <table>
        <tr><th>Full Name</th><td id="name"></td></tr>
        <tr><th>Email</th><td id="email"></td></tr>
        <tr><th>Staff ID</th><td id="staffId"></td></tr>
      </table>
    </div>

    <div class="section">
      <h2>Courses Teaching</h2>
      <table id="coursesTable">
        <tr><th>Course Code</th></tr>
      </table>
    </div>

  </div>
</main>

<footer>
© 2026 University Submission Portal (USP). All rights reserved.
</footer>

<script>
/* ===== MOBILE MENU FIX ===== */
const toggle=document.getElementById('menuToggle');
const nav=document.getElementById('navMenu');

toggle.onclick=e=>{
  e.stopPropagation();
  nav.classList.toggle('active');
};

document.addEventListener('click',e=>{
  if(!nav.contains(e.target) && !toggle.contains(e.target)){
    nav.classList.remove('active');
  }
});

/* ===== DATA ===== */
const lecturer=JSON.parse(
  localStorage.getItem('lecturerProfile') ||
  '{"name":"Dr. John Doe","email":"john@kwasu.edu.ng","staffId":"STAFF001","courses":[]}'
);

name.innerText=lecturer.name;
email.innerText=lecturer.email;
staffId.innerText=lecturer.staffId;

const coursesTable=document.getElementById('coursesTable');
if(lecturer.courses.length===0){
  coursesTable.innerHTML+=`<tr><td>No courses assigned yet</td></tr>`;
}else{
  lecturer.courses.forEach(c=>{
    coursesTable.innerHTML+=`<tr><td>${c}</td></tr>`;
  });
}

function logout(){
  window.location.href='lecturer signup and login.html';
}

/* COPY PROTECTION */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.ctrlKey && ['c','x','u','s'].includes(e.key.toLowerCase())) e.preventDefault();
});
</script>

</body>
</html>
